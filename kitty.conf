# 窗口最大化（kitty 没有直接配置项，可用快捷键 Ctrl+Shift+F11 切换全屏）
#
# input: kitty +kitten themes
# include ~/.config/kitty/kitty-themes/themes/tokyo_night_moon.conf
include ~/.config/kitty/kitty-themes/themes/Monokai_Soda.conf

term xterm-256color

# 字体设置
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
font_size        12.0

# scroll buffer lines
scrollback_lines 80000

# Switching tabs
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10
map ctrl+tab next
map ctrl+shift+T new_tab_with_cwd

# Move Window to forward  `ctr+shift+f`
# Move Window to backward `ctrl+shift+b`
# Move Window to top      `ctrl+shift+``
# switch to next window       `ctrl+shift+[`
# switch to previous window   `ctrl+shift+[`
# switch to neighboring window
map ctrl+shift+L neighboring_window right
map ctrl+shift+H neighboring_window left
map ctrl+shift+K neighboring_window up
map ctrl+shift+J neighboring_window down

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+E new_window
map ctrl+shift+W close_window
