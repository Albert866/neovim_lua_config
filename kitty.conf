# Config file from `.config/kitty/kitty.conf`
#
# themes downloaded from `https://github.com/dexpota/kitty-themes`
# themes select `kitty +kitten themes`
include kitty-themes/themes/Monokai_Soda.conf

term xterm-256color

# font configuration
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
font_size        12.0

# scroll buffer lines
scrollback_lines 80000

# custom Switching tabs
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10
# default new tab `ctrl+shift+T`
# custom new tab new_tab_with_cwd
map ctrl+shift+Y new_tab_with_cwd

# default window operation
#
# maximize window        `ctrl+shift+F11`
#
# switch to next window       `ctrl+shift+[`
# switch to previous window   `ctrl+shift+[`
#
# map ctrl+shift+enter new_window
# map ctrl+shift+W close_window
#
# Move Window to forward  `ctr+shift+F`
# Move Window to backward `ctrl+shift+B`
# Move Window to top      `ctrl+shift+``

# custom window operation
map ctrl+shift+L neighboring_window right
map ctrl+shift+H neighboring_window left
map ctrl+shift+K neighboring_window up
map ctrl+shift+J neighboring_window down
map ctrl+tab next_window
map ctrl+shift+O new_window_with_cwd
